<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>InsideToInsight — Example</title>
<link rel="stylesheet" href="css/main.css">
<style>
  .example-banner {
    background: #fff3e0;
    border-bottom: 3px solid #ffb74d;
    padding: 12px 16px;
    text-align: center;
    font-weight: bold;
    color: #e65100;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="example-banner">✨ Example 환경 (독립적 데이터)</div>
<div id="app"></div><div id="toast" class="toast"></div>
<div id="exampleModal" class="insight-modal"><div class="modal"><div class="modal-head"><h2>Example — 한서윤</h2><button class="close" id="closeExample">×</button></div><div class="hint">가상의 인물 한서윤을 기준으로 구성한 구조화된 데모입니다.</div><div class="modal-actions"><button class="secondary" id="cancelExample">닫기</button></div></div></div>
<div id="insightModal" class="insight-modal"><div class="modal"><div class="modal-head"><h2>✦ AI Insight 프롬프트</h2><button class="close" id="closeModal">×</button></div><div class="section-label">📍 분석 범위 설정</div><div class="hint" style="margin-bottom:10px">분석에 포함할 카테고리를 선택하세요 (선택 안 한 것은 제외됩니다)</div><div id="categoryCheckboxes" style="background:#f5f5f5;border-radius:6px;padding:12px;margin-bottom:12px;max-height:150px;overflow-y:auto"></div><div class="row" style="gap:8px;margin-bottom:12px"><button class="secondary" id="selectAllCats" style="flex:1">전체 선택</button><button class="secondary" id="deselectAllCats" style="flex:1">전체 해제</button></div><div class="section-label">질의사항</div><textarea id="questionInput" placeholder="예: 내가 요즘 공부를 미루는 이유는 무엇일까?"></textarea><div class="hint" style="margin-top:8px">선택된 카테고리의 기록을 카테고리별·날짜순으로 묶고, <b>기록 제목과 세부 라벨</b>을 포함해 AI용 프롬프트를 생성합니다.</div><div class="row" style="margin-top:12px"><button class="primary" id="generateBtn">프롬프트 생성</button></div><div class="section-label">생성된 프롬프트</div><div id="promptOutput" class="output">아직 생성된 프롬프트가 없습니다.</div><div class="modal-actions"><button class="secondary" id="copyBtn">복사</button><button class="secondary" id="downloadBtn">TXT 저장</button></div></div></div>
<div id="searchModal" class="insight-modal"><div class="modal"><div class="modal-head"><h2>🔍 검색</h2><button class="close" id="closeSearch">×</button></div><div class="section-label">검색 대상</div><select id="searchType" style="width:100%;margin-bottom:12px"><option value="node">노드</option><option value="diary">노트내용</option></select><div class="section-label">검색어</div><input id="searchInput" placeholder="검색어 입력..." style="margin-bottom:12px"/><div id="searchResults" style="min-height:100px;max-height:400px;overflow:auto"></div></div></div>

<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/data/example-data-expanded.js"></script>

<script>
  // Example 페이지: 독립된 localStorage 키 사용
  // I2IState 오버라이드 전에 플래그 설정
  window._EXAMPLE_MODE = true;
  const EXAMPLE_STORAGE_KEY = 'insideToInsight.example.v2';
</script>

<script>
  // I2IState 메서드 오버라이드 (간단하고 확실한 방식)
  const originalLoad = I2IState.load;
  const originalSave = I2IState.save;

  I2IState.load = function() {
    try {
      const raw = localStorage.getItem(EXAMPLE_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          categories: parsed.categories || this.DEFAULT_CATEGORIES,
          entries: this.normalizeEntries(parsed.entries || {}),
          nodes: this.normalizeNodes(parsed.nodes || []),
          relationships: this.normalizeRelationships(parsed.relationships || [])
        };
      }
    } catch (e) {
      console.error('Failed to load example data from localStorage:', e);
    }

    // localStorage 없으면 EXAMPLE_DATA_V2 기본값
    if (window.EXAMPLE_DATA_V2) {
      return this.clone(window.EXAMPLE_DATA_V2);
    }

    return {
      categories: this.DEFAULT_CATEGORIES,
      entries: this.DEFAULT_CATEGORIES.reduce((acc, cat) => (acc[cat] = [], acc), {}),
      nodes: [],
      relationships: []
    };
  };

  I2IState.save = function(state) {
    localStorage.setItem(EXAMPLE_STORAGE_KEY, JSON.stringify(state));
  };
</script>

<script src="js/features/physics.js"></script>
<script src="js/features/layout.js"></script>
<script src="js/features/render.js"></script>
<script src="js/features/ui.js"></script>
<script src="js/features/mindmap.js"></script>
<script src="js/features/graph.js"></script>
<script src="js/features/insight.js"></script>
<script src="js/app.js"></script>
</body>
</html>
